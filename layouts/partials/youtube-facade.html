<!-- Click-to-load YouTube embed. Renders a thumbnail + play button and only requests the 
     real player (via youtube-nocookie.com) once the user clicks, so the page doesn't pay 
     for YouTube's JS/network weight or set any YouTube cookies until there's actual 
     intent to watch.
     Params: id (video id, required), title (accessible label, required)
-->
<div class="yt-facade" data-yt-id="{{ .id }}" data-yt-title="{{ .title }}">
    <img class="yt-facade-thumb" src="https://i.ytimg.com/vi/{{ .id }}/sddefault.jpg" alt="" loading="lazy" width="720" height="540" />
    <button type="button" class="yt-facade-play" aria-label="{{ i18n "youtube_play_label" | safeHTML }} {{.title }}">
        <span class="yt-facade-play-icon" aria-hidden="true"></span>
    </button>
</div>
